<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Петровские высоты</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #waterToggle {
        position: absolute;
        top: 50px;
        right: 10px;
        z-index: 1000;
        background: white;
        border: 2px solid #ccc;
        border-radius: 4px;
        padding: 10px 15px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        transition: background-color 0.3s;
      }
      #waterToggle:hover {
        background-color: #f0f0f0;
      }
      #waterToggle.active {
        background-color: #50c878;
        color: white;
        border-color: #50c878;
      }
      #overlayControls {
        position: absolute;
        top: 60px;
        right: 10px;
        z-index: 1000;
        background: white;
        border: 2px solid #ccc;
        border-radius: 4px;
        padding: 15px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      #overlayControls h3 {
        margin: 0 0 10px 0;
        font-size: 14px;
        color: #333;
      }
      .slider-group {
        margin-bottom: 10px;
      }
      .slider-group label {
        display: block;
        margin-bottom: 3px;
        color: #666;
        font-size: 11px;
      }
      .slider-group input[type="range"] {
        width: 1000px;
        margin-bottom: 2px;
      }
      .slider-value {
        font-weight: bold;
        color: #333;
      }
    </style>
    <script
      src="https://api-maps.yandex.ru/2.1/?apikey=ваш_ключ&lang=ru_RU"
      type="text/javascript"
    ></script>
    <script
      src="https://unpkg.com/leaflet@1.0.3/dist/leaflet.js"
      type="text/javascript"
    ></script>
    <script
      src="https://kartena.github.io/Proj4Leaflet/lib/proj4-compressed.js"
      type="text/javascript"
    ></script>
    <script src="polygons.js" type="text/javascript"></script>
    <!-- <script src="peoples.js" type="text/javascript"></script> -->
    <script src="base.js" type="text/javascript"></script>
  </head>
  <body>
    <button id="waterToggle">💧 Слой воды</button>
    <div id="overlayControls" style="display: none;">
      <h3>Настройка границ воды</h3>
      <div class="slider-group">
        <label>Y низ Широта (нижний левый): <span class="slider-value" id="0.0_l"></span></label>
        <input type="range" id="0.0" step="0.000001">
      </div>
      <div class="slider-group">
        <label>X низ Долгота (нижний левый): <span class="slider-value" id="0.1_l"></span></label>
        <input type="range" id="0.1" step="0.00001">
      </div>
      <div class="slider-group">
        <label>Y верх Широта (верхний правый): <span class="slider-value" id="1.0_l"></span></label>
        <input type="range" id="1.0" step="0.00001">
      </div>
      <div class="slider-group">
        <label>Х верх Долгота (верхний правый): <span class="slider-value" id="1.1_l"></span></label>
        <input type="range" id="1.1" step="0.00001">
      </div>
    </div>
    <div id="map"></div>
  </body>
</html>
